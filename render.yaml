services:
  - type: web
    name: cacaoguard
    env: python
    plan: free
    branch: production-ready
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn cacaoguard.wsgi:application --bind 0.0.0.0:$PORT --workers=1 --threads=2 --timeout=120 --max-requests=100 --max-requests-jitter=10 --log-level=info --access-logfile=- --error-logfile=-
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: cacaoguard.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 1

