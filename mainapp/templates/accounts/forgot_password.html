{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password - CacaoGuard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const firebaseConfig = {
        apiKey: "AIzaSyAs90apE9AG6k4aIg9MpJD750OsvVD70m4",
        authDomain: "systemcacao.firebaseapp.com",
        databaseURL: "https://systemcacao-default-rtdb.firebaseio.com",
        projectId: "systemcacao",
        storageBucket: "systemcacao.appspot.com",
        messagingSenderId: "35186667542",
        appId: "1:35186667542:web:14fcda24f86fee52f60537",
        measurementId: "G-S90GVN477H"
      };

      firebase.initializeApp(firebaseConfig);

      const resetForm = document.getElementById('reset-form');
      resetForm.addEventListener('submit', function (e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const successContainer = document.getElementById('success-container');
        const errorContainer = document.getElementById('error-container');

        successContainer.classList.add('hidden');
        errorContainer.classList.add('hidden');

        const submitBtn = document.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Sending reset link...';

        firebase.auth().sendPasswordResetEmail(email)
          .then(() => {
            showSuccess("Password reset link sent. Please check your email.");
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Send Reset Link';
          })
          .catch((error) => {
            showError(error.message);
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Send Reset Link';
          });

        function showSuccess(message) {
          document.getElementById('success-message').textContent = message;
          successContainer.classList.remove('hidden');
        }

        function showError(message) {
          document.getElementById('error-message').textContent = message;
          errorContainer.classList.remove('hidden');
        }
      });
    });
  </script>
</head>

<body class="bg-gray-50">
  <div class="flex items-center justify-center min-h-screen px-4">
    <div class="bg-white shadow-xl rounded-lg p-8 w-full max-w-md relative">
      
      <!-- Close Button -->
      <div class="absolute top-4 right-4">
        <a href="{% url 'login' %}" class="text-gray-500 hover:text-gray-700">
          <i class="fas fa-times text-2xl"></i>
        </a>
      </div>

      <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Reset Your Password</h2>

      <!-- Success -->
      <div id="success-container" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4">
        <span id="success-message"></span>
        <span class="absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer" onclick="document.getElementById('success-container').classList.add('hidden')">
          <i class="fas fa-times"></i>
        </span>
      </div>

      <!-- Error -->
      <div id="error-container" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
        <span id="error-message"></span>
        <span class="absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer" onclick="document.getElementById('error-container').classList.add('hidden')">
          <i class="fas fa-times"></i>
        </span>
      </div>

      <form id="reset-form">
        {% csrf_token %}
        <div class="mb-6">
          <label class="block text-gray-700 mb-2" for="email">Enter your email</label>
          <div class="relative">
            <input id="email" type="email" name="email" class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 pl-10" required>
            <i class="fas fa-envelope absolute left-3 top-3 text-gray-500"></i>
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
          Send Reset Link
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-6">
        Remembered your password?
        <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Back to Login</a>
      </p>
    </div>
  </div>
</body>
</html>
