{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - CacaoGuard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-green: #10b981;
      --primary-blue: #3b82f6;
      --dark-green: #065f46;
      --accent-brown: #92400e;
      --gradient-primary: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      --gradient-secondary: linear-gradient(135deg, #065f46 0%, #10b981 100%);
      --gradient-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    * {
      font-family: 'League Spartan', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #10b981 75%, #3b82f6 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Background Elements */
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="25" cy="25" r="0.5" fill="rgba(255,255,255,0.05)"/><circle cx="75" cy="75" r="0.8" fill="rgba(255,255,255,0.08)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
      animation: float 20s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes float {
      0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
      25% { transform: translateX(-20px) translateY(-20px) rotate(1deg); }
      50% { transform: translateX(20px) translateY(-40px) rotate(-1deg); }
      75% { transform: translateX(-10px) translateY(-20px) rotate(0.5deg); }
    }

    /* Floating shapes */
    .shape {
      position: absolute;
      opacity: 0.1;
      z-index: 1;
    }

    .shape-1 {
      top: 10%;
      left: 10%;
      width: 80px;
      height: 80px;
      background: linear-gradient(45deg, #10b981, #3b82f6);
      border-radius: 50%;
      animation: floatShape1 15s ease-in-out infinite;
    }

    .shape-2 {
      top: 70%;
      right: 10%;
      width: 60px;
      height: 60px;
      background: linear-gradient(45deg, #3b82f6, #8b5cf6);
      border-radius: 20px;
      animation: floatShape2 18s ease-in-out infinite reverse;
    }

    .shape-3 {
      top: 30%;
      right: 20%;
      width: 40px;
      height: 40px;
      background: linear-gradient(45deg, #10b981, #06d6a0);
      transform: rotate(45deg);
      animation: floatShape3 12s ease-in-out infinite;
    }

    @keyframes floatShape1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(180deg); }
    }

    @keyframes floatShape2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(-180deg); }
    }

    @keyframes floatShape3 {
      0%, 100% { transform: translateY(0px) rotate(45deg); }
      50% { transform: translateY(-25px) rotate(225deg); }
    }

    /* Login Container */
    .login-container {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      border-radius: 24px;
      animation: slideInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(60px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Close Button */
    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(156, 163, 175, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .close-btn:hover {
      background: rgba(239, 68, 68, 0.1);
      transform: rotate(90deg) scale(1.1);
      border-color: rgba(239, 68, 68, 0.3);
    }

    /* Title */
    .login-title {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      font-size: 2rem;
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeInDown 0.8s ease 0.2s both;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 1.5rem;
      animation: fadeInUp 0.6s ease both;
    }

    .form-group:nth-child(1) { animation-delay: 0.3s; }
    .form-group:nth-child(2) { animation-delay: 0.4s; }
    .form-group:nth-child(3) { animation-delay: 0.5s; }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-label {
      display: block;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .input-container {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 16px 16px 16px 48px;
      border: 2px solid rgba(156, 163, 175, 0.2);
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary-green);
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-2px);
      box-shadow: 
        0 10px 25px rgba(16, 185, 129, 0.15),
        0 0 0 4px rgba(16, 185, 129, 0.1);
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .form-input:focus + .input-icon {
      color: var(--primary-green);
      transform: translateY(-50%) scale(1.1);
    }

    .toggle-password {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .toggle-password:hover {
      color: var(--primary-green);
      background: rgba(16, 185, 129, 0.1);
    }

    /* Messages */
    .message {
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      position: relative;
      border-left: 4px solid;
      animation: slideInRight 0.5s ease;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .message-error {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
      border-left-color: #ef4444;
      color: #dc2626;
    }

    .message-success {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.05));
      border-left-color: #10b981;
      color: #059669;
    }

    .message-info {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(59, 130, 246, 0.05));
      border-left-color: #3b82f6;
      color: #2563eb;
    }

    .message-close {
      position: absolute;
      top: 12px;
      right: 12px;
      cursor: pointer;
      color: inherit;
      opacity: 0.7;
      transition: opacity 0.3s ease;
    }

    .message-close:hover {
      opacity: 1;
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      padding: 16px;
      background: var(--gradient-primary);
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.6s ease 0.6s both;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--gradient-secondary);
      transition: left 0.5s ease;
      z-index: -1;
    }

    .btn-primary:hover::before {
      left: 0;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4);
    }

    .btn-primary:active {
      transform: translateY(-1px);
    }

    /* Links */
    .link {
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 600;
      position: relative;
      transition: all 0.3s ease;
    }

    .link::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--gradient-primary);
      transition: width 0.3s ease;
    }

    .link:hover::after {
      width: 100%;
    }

    .link:hover {
      color: var(--primary-green);
    }

    .guest-link {
      color: var(--primary-green);
      font-weight: 700;
    }

    .guest-link:hover {
      color: var(--dark-green);
    }

    /* Additional Animations */
    .divider {
      text-align: center;
      color: #9ca3af;
      font-weight: 500;
      position: relative;
      animation: fadeIn 0.6s ease 0.7s both;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 45%;
      height: 1px;
      background: linear-gradient(to right, transparent, #e5e7eb, transparent);
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Responsive Design */
    @media (max-width: 640px) {
      .login-container {
        margin: 1rem;
        padding: 2rem 1.5rem;
        border-radius: 20px;
      }

      .login-title {
        font-size: 1.75rem;
      }

      .form-input {
        padding: 14px 14px 14px 44px;
      }

      .input-icon {
        left: 14px;
      }

      .toggle-password {
        right: 14px;
      }
    }

    /* Loading Animation */
    .loading {
      position: relative;
      overflow: hidden;
    }

    .loading::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { left: -100%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <!-- Floating Background Shapes -->
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>

  <div class="flex items-center justify-center min-h-screen px-4 py-8">
    <div class="login-container p-10 w-full max-w-md relative">
      <!-- Close Button -->
      <a href="{% url 'home' %}" class="close-btn">
        <i class="fas fa-times text-lg"></i>
      </a>

      <!-- Logo + Title -->
<div class="text-center mb-8">
  <!-- Logo -->
 <div class="inline-flex items-center justify-center w-20 h-20 rounded-full mb-4 overflow-hidden">
  <img src="{% static 'images/NOBGHERO.png' %}" 
       alt="CacaoGuard Logo" 
       class="w-16 h-16 object-contain transition-transform duration-300 ease-in-out hover:scale-110" />
</div>


  <!-- Title -->
  <h2 class="text-3xl font-bold text-gray-800">
    Login to <span class="text-[#1e3a8a]">CacaoGuard</span>
  </h2>
</div>


      <!-- Messages -->
      {% if messages %}
        {% for message in messages %}
          <div class="message 
                      {% if message.tags == 'error' %}message-error
                      {% elif message.tags == 'success' %}message-success
                      {% else %}message-info{% endif %}">
            {{ message }}
            <span class="message-close" onclick="this.parentElement.style.display='none';">
              <i class="fas fa-times"></i>
            </span>
          </div>
        {% endfor %}
      {% endif %}

      <!-- Login Form -->
      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-container">
            <input type="email" id="email" name="email" class="form-input" required placeholder="Enter your email">
            <i class="fas fa-envelope input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-container">
            <input type="password" id="password" name="password" class="form-input" required placeholder="Enter your password">
            <i class="fas fa-lock input-icon"></i>
            <i class="fas fa-eye-slash toggle-password" id="togglePassword"></i>
          </div>
        </div>

        <div class="form-group text-right">
          <a href="{% url 'forgot_password' %}" class="link text-sm">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary">
          <i class="fas fa-sign-in-alt mr-2"></i>
          Login
        </button>
      </form>

      <!-- Footer Links -->
      <p class="text-center text-sm text-gray-600 mt-8" style="animation: fadeIn 0.6s ease 0.8s both;">
        Don't have an account?
        <a href="{% url 'signup' %}" class="link">Create Account</a>
      </p>

      <p class="divider text-sm mt-4 mb-4">— or —</p>

      <p class="text-center text-sm mt-4" style="animation: fadeIn 0.6s ease 0.9s both;">
        <a href="{% url 'guest_dashboard' %}" class="guest-link">
          <i class="fas fa-user-friends mr-1"></i>
          Continue as Guest
        </a>
      </p>
    </div>
  </div>

  <script>
    // Password toggle functionality
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
  
    togglePassword.addEventListener('click', function () {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
  
      // Toggle icon
      this.classList.toggle('fa-eye');
      this.classList.toggle('fa-eye-slash');
    });

    // Enhanced form interactions
    document.addEventListener('DOMContentLoaded', function() {
      const inputs = document.querySelectorAll('.form-input');
      
      inputs.forEach(input => {
        input.addEventListener('focus', function() {
          this.parentElement.classList.add('focused');
        });
        
        input.addEventListener('blur', function() {
          this.parentElement.classList.remove('focused');
        });
      });

      // Auto-dismiss messages after 5 seconds
      const messages = document.querySelectorAll('.message');
      messages.forEach(message => {
        setTimeout(() => {
          message.style.opacity = '0';
          message.style.transform = 'translateX(20px)';
          setTimeout(() => {
            message.style.display = 'none';
          }, 300);
        }, 5000);
      });

      // Form submission loading state
      const form = document.querySelector('form');
      const submitBtn = document.querySelector('.btn-primary');
      
      form.addEventListener('submit', function() {
        submitBtn.classList.add('loading');
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Logging In...';
        submitBtn.disabled = true;
      });
    });

    // Smooth scroll and enhanced UX
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  </script>
</body>
</html>
