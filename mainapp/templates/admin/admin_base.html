<!-- 
    ADMIN HEADER WITH ORANGE GRADIENT
    FIX #8: Orange gradient for admin header
    Include this in all admin templates
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard - CacaoGuard{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Orange Gradient for Admin */
        .gradient-orange {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        }
        
        .notification-bell {
            position: relative;
            cursor: pointer;
        }
        
        .notification-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            animation: pulse 2s infinite;
        }
        
        .notification-panel {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 0.5rem;
            width: 380px;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .notification-panel.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }
        
        .notification-item {
            border-bottom: 1px solid #e5e7eb;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .notification-item:hover {
            background: #f9fafb;
        }
        
        .notification-item.unread {
            background: #fef3c7;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50">
    <!-- Admin Navigation with Orange Gradient -->
    <nav class="gradient-orange text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <!-- Logo and Title -->
                <div class="flex items-center space-x-4">
                    <i class="fas fa-seedling text-3xl"></i>
                    <h1 class="text-2xl font-bold">CacaoGuard Admin</h1>
                </div>
                
                <!-- Navigation Links and Actions -->
                <div class="flex items-center space-x-6">
                    <!-- Nav Links -->
                    <a href="/admin/dashboard/" class="hover:text-orange-200 transition flex items-center space-x-2">
                        <i class="fas fa-home"></i>
                        <span>Dashboard</span>
                    </a>
                    
                    <a href="/admin/ecommerce/" class="hover:text-orange-200 transition flex items-center space-x-2">
                        <i class="fas fa-shopping-cart"></i>
                        <span>E-Commerce</span>
                    </a>
                    
                    <a href="/admin/farm_location_fixed.html" class="hover:text-orange-200 transition flex items-center space-x-2">
                        <i class="fas fa-map-marked-alt"></i>
                        <span>Farm Mapping</span>
                    </a>
                    
                    <a href="/admin/scans/" class="hover:text-orange-200 transition flex items-center space-x-2">
                        <i class="fas fa-microscope"></i>
                        <span>Scan History</span>
                    </a>
                    
                    <!-- Notification Bell -->
                    <div class="notification-bell relative">
                        <button onclick="toggleNotifications()" class="text-white hover:text-orange-200 transition relative">
                            <i class="fas fa-bell text-2xl"></i>
                            <span id="notification-badge" class="notification-badge" style="display: none;">0</span>
                        </button>
                        
                        <!-- Notification Dropdown Panel -->
                        <div id="notification-panel" class="notification-panel">
                            <div class="p-4 border-b bg-orange-50 flex justify-between items-center">
                                <h3 class="font-semibold text-gray-800">Notifications</h3>
                                <button onclick="markAllAsRead()" class="text-sm text-orange-600 hover:text-orange-700 font-medium">
                                    Mark all read
                                </button>
                            </div>
                            <div id="notification-list">
                                <div class="p-8 text-center text-gray-500">
                                    <i class="fas fa-bell-slash text-4xl mb-2"></i>
                                    <p>No notifications</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Profile -->
                    <div class="flex items-center space-x-2">
                        <img src="https://ui-avatars.com/api/?name={{ request.session.name|urlencode }}&background=f97316&color=fff" 
                             alt="Admin" 
                             class="w-10 h-10 rounded-full border-2 border-white">
                        <div class="hidden md:block">
                            <p class="font-medium text-sm">{{ request.session.name }}</p>
                            <p class="text-xs text-orange-200">Administrator</p>
                        </div>
                    </div>
                    
                    <!-- Logout -->
                    <a href="{% url 'logout_view' %}" class="hover:text-orange-200 transition flex items-center space-x-2">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8">
        {% block content %}
        <!-- Page content goes here -->
        {% endblock %}
    </main>

    <!-- Scripts -->
    <script src="{% static 'js/notifications.js' %}"></script>
    <script src="{% static 'js/order_manager.js' %}"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
