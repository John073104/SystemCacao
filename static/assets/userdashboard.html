<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - CacaoGuard</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fef3e2 0%, #f3e8ff 50%, #e0f2fe 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .gradient-text {
            background: linear-gradient(135deg, #f59e0b 0%, #d946ef 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card {
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .icon-gradient-1 { background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%); }
        .icon-gradient-2 { background: linear-gradient(135deg, #d946ef 0%, #a855f7 100%); }
        .icon-gradient-3 { background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); }
        .icon-gradient-4 { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    </style>
 <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <!-- Sidebar -->
        {% include 'user/sidebar.html' %}

        <!-- Main Content -->
        <div class="flex-1 p-8 overflow-y-auto">

            {% block content %}
        <!-- Header -->
        <div class="glass-card p-6 rounded-2xl shadow-lg mb-8 animate-fade-in">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-16 h-16 icon-gradient-3 rounded-2xl flex items-center justify-center animate-float">
                        <i class="fas fa-seedling text-white text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold gradient-text">CacaoGuard User</h1>
                        <p class="text-gray-600">User Dashboard</p>
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <span class="px-4 py-2 bg-emerald-100 text-emerald-800 rounded-full text-sm font-medium">
                        <i class="fas fa-circle text-emerald-500 mr-1"></i>
                        System Online
                    </span>
                    <div class="text-right">
                        <p class="text-sm text-gray-500" id="current-time"></p>
                        <p class="text-xs text-gray-400">Philippines</p>
                    </div>
                </div>
            </div>
        </div>
        
    
    </div>
    {% endblock %}
    <script>
        // Update current time
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleString('en-PH', {
                weekday: 'short',
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('current-time').textContent = timeString;
        }

        updateTime();
        setInterval(updateTime, 60000); // Update every minute
    </script>
    
</body>
</html>
